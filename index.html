<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Attendance Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      color: #333;
      animation: fadeIn 1s ease-in;
    }
    header {
      padding: 20px;
      background: #333;
      color: white;
      font-size: 22px;
      font-weight: bold;
      animation: slideDown 0.8s ease-in-out;
    }
    main {
      padding: 20px;
    }
    select, input, button {
      margin: 10px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #555;
    }
    button {
      background: #333;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #555;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      animation: popUp 0.5s ease-in-out;
    }
    footer {
      margin-top: 30px;
      padding: 10px;
      background: #222;
      color: white;
      font-size: 14px;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    @keyframes slideDown {
      from {transform: translateY(-100%);}
      to {transform: translateY(0);}
    }
    @keyframes popUp {
      from {transform: scale(0.8); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }
  </style>
</head>
<body>
  <header>Professional Attendance Calculator</header>
  <main>
    <p>Select a month, mark Saturdays if working, and enter absent days:</p>

    <label for="month">Choose Month:</label>
    <select id="month">
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>
    <br>

    <label>Saturdays (tick if working):</label><br>
    <input type="checkbox" id="sat1"> 1st Saturday
    <input type="checkbox" id="sat2"> 2nd Saturday
    <input type="checkbox" id="sat3"> 3rd Saturday
    <input type="checkbox" id="sat4"> 4th Saturday
    <br>

    <label for="absent">Absent Days:</label>
    <input type="number" id="absent" min="0" value="0">
    <br>

    <button onclick="calculateAttendance()">Calculate Attendance</button>

    <div id="output" class="result"></div>
  </main>

  <footer>
    &copy; 2025 Shaik Shabbir | All Rights Reserved
  </footer>

  <script>
    function calculateAttendance() {
      const month = parseInt(document.getElementById("month").value);
      const year = new Date().getFullYear();
      const absent = parseInt(document.getElementById("absent").value);

      // Get total days in month
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Count Sundays
      let sundays = 0;
      for (let d = 1; d <= totalDays; d++) {
        let day = new Date(year, month, d).getDay();
        if (day === 0) sundays++;
      }

      // Saturdays (checked ones count as working days)
      let saturdays = 0;
      if (document.getElementById("sat1").checked) saturdays++;
      if (document.getElementById("sat2").checked) saturdays++;
      if (document.getElementById("sat3").checked) saturdays++;
      if (document.getElementById("sat4").checked) saturdays++;

      // Working days (exclude Sundays, add selected Saturdays)
      let workingDays = totalDays - sundays + saturdays;

      // Present days
      let presentDays = workingDays - absent;
      if (presentDays < 0) presentDays = 0;

      // Percentage
      let percentage = ((presentDays / workingDays) * 100).toFixed(2);

      document.getElementById("output").innerHTML = `
        <p><b>Total Days in Month:</b> ${totalDays}</p>
        <p><b>Total Working Days (excl. Sundays + selected Saturdays):</b> ${workingDays}</p>
        <p><b>Absent Days:</b> ${absent}</p>
        <p><b>Present Days:</b> ${presentDays}</p>
        <p><b>Attendance Percentage:</b> ${percentage}%</p>
      `;
    }
  </script>
</body>
</html>
