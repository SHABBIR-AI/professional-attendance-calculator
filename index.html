<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Attendance Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      text-align: center;
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
    }
    h2 {
      color: #222;
      animation: slideIn 1s ease-in-out;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    select, input {
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    .result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      animation: fadeIn 1s ease-in-out;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #222;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h2>Monthly Attendance Calculator</h2>

  <label for="month">Select Month:</label>
  <select id="month">
    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
  </select>

  <label><input type="checkbox" id="sat1"> Include 1st Saturday</label>
  <label><input type="checkbox" id="sat2"> Include 2nd Saturday</label>
  <label><input type="checkbox" id="sat3"> Include 3rd Saturday</label>
  <label><input type="checkbox" id="sat4"> Include 4th Saturday</label>

  <label for="absent">Number of days absent:</label>
  <input type="number" id="absent" placeholder="Enter absent days">

  <button onclick="calculateAttendance()">Calculate Attendance</button>

  <div class="result" id="result"></div>

  <footer>© 2025 Shaik Shabbir</footer>

  <script>
    function calculateAttendance() {
      const month = parseInt(document.getElementById("month").value);
      const year = new Date().getFullYear();
      const absent = parseInt(document.getElementById("absent").value) || 0;

      // ✅ Calculate total days in selected month
      const totalDays = new Date(year, month, 0).getDate();

      let workingDays = 0;

      // Loop through all days in month
      for (let day = 1; day <= totalDays; day++) {
        const date = new Date(year, month - 1, day);
        const weekday = date.getDay(); // 0 = Sunday, 6 = Saturday

        if (weekday !== 0) { // Exclude Sundays
          if (weekday === 6) {
            // Handle Saturdays with checkboxes
            const satIndex = Math.floor((day - 1) / 7) + 1;
            if (document.getElementById("sat" + satIndex)?.checked) {
              workingDays++;
            }
          } else {
            workingDays++;
          }
        }
      }

      const present = workingDays - absent;
      const percentage = workingDays > 0 ? ((present / workingDays) * 100).toFixed(2) : 0;

      document.getElementById("result").innerHTML = `
        Total working days: ${workingDays}<br>
        Days absent: ${absent}<br>
        Days present: ${present}<br>
        Attendance Percentage: ${percentage}%
      `;
    }
  </script>
</body>
</html>
