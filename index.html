<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Percentage Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 95%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      color: #333;
      animation: slideDown 0.8s ease-in-out;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
      text-align: left;
    }

    select, input {
      padding: 10px;
      width: 100%;
      border: 1px solid #aaa;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
    }

    select:focus, input:focus {
      border-color: #66a6ff;
      box-shadow: 0 0 8px #66a6ff;
    }

    .saturday-section {
      background: #f0f8ff;
      padding: 10px;
      border-radius: 10px;
      animation: fadeInUp 1s ease-in-out;
    }

    .saturday-section h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: #444;
    }

    .saturday-checks {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .saturday-checks label {
      font-size: 14px;
      color: #222;
    }

    button {
      padding: 10px;
      width: 100%;
      background: linear-gradient(135deg, #66a6ff, #89f7fe);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease-in-out, background 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      animation: fadeIn 1s ease-in-out;
    }

    footer {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95);}
      to { opacity: 1; transform: scale(1);}
    }
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0;}
      to { transform: translateY(0); opacity: 1;}
    }
    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0;}
      to { transform: translateY(0); opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Attendance Calculator</h2>

    <label for="month">Select Month:</label>
    <select id="month">
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7">July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>

    <label for="absent">Number of days absent:</label>
    <input type="number" id="absent" placeholder="Enter absent days">

    <!-- Saturday section -->
    <div class="saturday-section">
      <h3>Saturdays (Tick if working)</h3>
      <div class="saturday-checks">
        <label><input type="checkbox" id="sat1"> Sat 1</label>
        <label><input type="checkbox" id="sat2"> Sat 2</label>
        <label><input type="checkbox" id="sat3"> Sat 3</label>
        <label><input type="checkbox" id="sat4"> Sat 4</label>
      </div>
    </div>

    <button onclick="calculateAttendance()">Calculate Attendance</button>

    <p id="result"></p>

    <footer>© 2025 Shaik Shabbir</footer>
  </div>

  <script>
    function calculateAttendance() {
      const month = parseInt(document.getElementById('month').value);
      const absent = parseInt(document.getElementById('absent').value) || 0;
      
      const year = new Date().getFullYear();
      const totalDays = new Date(year, month, 0).getDate();

      // Count Sundays in the month
      let sundays = 0;
      for (let d = 1; d <= totalDays; d++) {
        const date = new Date(year, month - 1, d);
        if (date.getDay() === 0) sundays++; 
      }

      // Saturdays included only if checked
      let saturdaysIncluded = 0;
      if (document.getElementById('sat1').checked) saturdaysIncluded++;
      if (document.getElementById('sat2').checked) saturdaysIncluded++;
      if (document.getElementById('sat3').checked) saturdaysIncluded++;
      if (document.getElementById('sat4').checked) saturdaysIncluded++;

      const workingDays = (totalDays - sundays) - (4 - saturdaysIncluded); 
      const present = workingDays - absent;

      const percentage = ((present / workingDays) * 100).toFixed(2);

      document.getElementById('result').innerHTML =
        `📅 Total Working Days: ${workingDays}<br>
         ❌ Absent Days: ${absent}<br>
         ✅ Present Days: ${present}<br>
         📊 Attendance Percentage: ${percentage}%`;
    }
  </script>
</body>
</html>
